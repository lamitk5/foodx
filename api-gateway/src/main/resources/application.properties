spring.application.name=api-gateway
server.port=8080

# Forward timeout — AI chat có thể mất 10–20s, đừng cắt sớm
spring.mvc.async.request-timeout=90000

# Tomcat threads cho gateway (mọi request đều đi qua đây)
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=30
server.tomcat.accept-count=200

# Rate limit: mặc định 120/phút/user (hoặc IP nếu không có JWT)
# backend=memory (default) | redis (cần spring.data.redis.host)
app.rate-limit-per-minute=${RATE_LIMIT_PER_MINUTE:${APP_RATE_LIMIT_PER_MINUTE:120}}
app.rate-limit.backend=${RATE_LIMIT_BACKEND:${APP_RATE_LIMIT_BACKEND:memory}}
app.ai.max-concurrent-global=${AI_MAX_CONCURRENT_GLOBAL:${APP_AI_MAX_CONCURRENT_GLOBAL:24}}
# Redis (chỉ dùng khi backend=redis)
spring.data.redis.host=${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
spring.data.redis.port=${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.lettuce.shutdown-timeout=100ms

# File upload forwarding (tat multipart resolver o gateway de stream multipart nguyen ven sang downstream)
spring.servlet.multipart.enabled=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Downstream Microservices (địa chỉ gốc)
gateway.services.user-service=${GATEWAY_SERVICES_USER_SERVICE:http://localhost:8081}
gateway.services.inventory-service=${GATEWAY_SERVICES_INVENTORY_SERVICE:http://localhost:8082}
gateway.services.recipe-service=${GATEWAY_SERVICES_RECIPE_SERVICE:http://localhost:8083}
gateway.services.plan-shopping-service=${GATEWAY_SERVICES_PLAN_SHOPPING_SERVICE:http://localhost:8084}
gateway.services.ai-service=${GATEWAY_SERVICES_AI_SERVICE:http://localhost:8085}
gateway.services.social-stats-service=${GATEWAY_SERVICES_SOCIAL_STATS_SERVICE:http://localhost:8086}

# Bảng định tuyến: tiền tố đường dẫn -> service nhận request.
# Quy tắc dài nhất được ưu tiên. Thêm service mới chỉ cần thêm ở đây, không sửa mã Java.
# Lưu ý: /internal/** KHÔNG bao giờ được proxy ra ngoài (cổng nội bộ giữa các service).
gateway.routes[0].path=/api/auth
gateway.routes[0].uri=${gateway.services.user-service}
gateway.routes[1].path=/api/profile
gateway.routes[1].uri=${gateway.services.user-service}
gateway.routes[2].path=/api/admin
gateway.routes[2].uri=${gateway.services.user-service}

gateway.routes[3].path=/api/fridge
gateway.routes[3].uri=${gateway.services.inventory-service}
gateway.routes[4].path=/api/ingredients
gateway.routes[4].uri=${gateway.services.inventory-service}
gateway.routes[5].path=/api/upload
gateway.routes[5].uri=${gateway.services.inventory-service}

gateway.routes[6].path=/api/recipes
gateway.routes[6].uri=${gateway.services.recipe-service}
gateway.routes[7].path=/api/home
gateway.routes[7].uri=${gateway.services.recipe-service}
gateway.routes[8].path=/api/favorites
gateway.routes[8].uri=${gateway.services.recipe-service}

gateway.routes[9].path=/api/plan
gateway.routes[9].uri=${gateway.services.plan-shopping-service}
gateway.routes[10].path=/api/shopping
gateway.routes[10].uri=${gateway.services.plan-shopping-service}

gateway.routes[11].path=/api/ai
gateway.routes[11].uri=${gateway.services.ai-service}
gateway.routes[12].path=/api/chat
gateway.routes[12].uri=${gateway.services.ai-service}

gateway.routes[13].path=/api/social
gateway.routes[13].uri=${gateway.services.social-stats-service}
gateway.routes[14].path=/api/stats
gateway.routes[14].uri=${gateway.services.social-stats-service}

# HTTP Compression (Gzip)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024
