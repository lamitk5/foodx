spring.application.name=foodx-dev


# ====== Datasource (MySQL cục bộ) ======
spring.datasource.url=jdbc:mysql://localhost:3306/foodx?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ====== JPA ======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ====== JWT (cho môi trường dev) ======
app.jwt.secret=dev-super-secret-key-please-change-this-key-32bytes!!
