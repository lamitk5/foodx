# =============================================================
# FoodX - Cấu hình môi trường DEV
# Database: MySQL (dữ liệu lưu bền)
# =============================================================
spring.profiles.active=dev

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/foodx?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=02102005
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate tự tạo/ cập nhật bảng từ Entity
spring.jpa.hibernate.ddl-auto=update

# Tắt console H2
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Xem log SQL cho việc gỡ lỗi
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nạp schema + dữ liệu mẫu khi khởi động (true = bật)
spring.sql.init.mode=never

