spring.application.name=foodx

spring.profiles.active=dev

# ====== SpringDoc / Swagger ======
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ====== JWT (mặc định, có thể ghi đè theo environment) ======
app.jwt.secret=YOUR_BASE64_SECRET_KEY_PLEASE_CHANGE_IN_PRODUCTION_AT_LEAST_32_BYTES
app.jwt.expiration-ms=86400000
app.jwt.issuer=foodx

# ====== Upload file ======
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ====== Gemini API (du phong khi Groq loi) ======
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-3.5-flash
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models

# ====== Groq API (uu tien; tu dong chuyen sang Gemini khi Groq loi) ======
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=groq/compound-mini
app.groq.url=https://api.groq.com/openai/v1/chat/completions

# ====== Logging ======
logging.level.org.hibernate.SQL=debug
