spring.application.name=foodx

spring.profiles.active=dev

# ====== SpringDoc / Swagger ======
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ====== JWT (mặc định, có thể ghi đè theo environment) ======
app.jwt.secret=YOUR_BASE64_SECRET_KEY_PLEASE_CHANGE_IN_PRODUCTION_AT_LEAST_32_BYTES
app.jwt.expiration-ms=86400000
app.jwt.issuer=foodx

# ====== Upload file ======
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ====== Tomcat / Hikari (đỡ vỡ khi nhiều user đồng thời) ======
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
spring.datasource.hikari.maximum-pool-size=24
spring.datasource.hikari.minimum-idle=6
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=60000

# ====== AI bulkhead + rate limit ======
app.ai.max-concurrent=12
app.ai.acquire-timeout-ms=3000
app.ai.context-cache-ttl-ms=45000
app.rate-limit-per-minute=120

# ====== Gemini API (du phong khi Groq loi) ======
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-2.0-flash
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models

# ====== Groq API (uu tien; tu dong chuyen sang Gemini khi Groq loi) ======
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=llama-3.3-70b-versatile
app.groq.url=https://api.groq.com/openai/v1/chat/completions

# ====== Logging ======
logging.level.org.hibernate.SQL=info

# ====== HTTP Compression (Gzip) ======
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024
