spring.application.name=foodx

spring.profiles.active=dev

# ====== SpringDoc / Swagger ======
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ====== JWT (mặc định, có thể ghi đè theo environment) ======
app.jwt.secret=YOUR_BASE64_SECRET_KEY_PLEASE_CHANGE_IN_PRODUCTION_AT_LEAST_32_BYTES
app.jwt.expiration-ms=86400000
app.jwt.issuer=foodx

# ====== Gemini API ======
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-3.5-flash
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models

# ====== Logging ======
logging.level.org.hibernate.SQL=debug
