# =============================================================
# FoodX - Cấu hình môi trường PRODUCTION
# Database: MySQL (cần tạo database trước)
# =============================================================
spring.profiles.active=prod

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/foodx?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:yourpassword}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Không tự reset dữ liệu
spring.jpa.hibernate.ddl-auto=update

# Tắt console H2 (không dùng trong prod)
spring.h2.console.enabled=false

# Tắt hiển thị SQL
spring.jpa.show-sql=false

# Không nạp schema mẫu
spring.sql.init.mode=never

# Spingdoc Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
