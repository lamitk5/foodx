# ====== Profile riêng để test AI chat KHÔNG cần MySQL ======
# Chạy: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=ai-test
#     : hoặc set SPRING_PROFILES_ACTIVE=ai-test

spring.application.name=foodx-ai-test

# In-memory H2 thay cho MySQL -> app khởi động được, thao tác AI không cần database thật.
spring.datasource.url=jdbc:h2:mem:foodxai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 console (tuỳ chọn để kiểm tra nếu cần): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ====== JWT (chung) ======
app.jwt.secret=dev-super-secret-key-please-change-this-key-32bytes!!
app.jwt.expiration-ms=86400000
app.jwt.issuer=foodx

# ====== Gemini (du phong khi Groq loi) ======
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-3.5-flash
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models

# ====== Groq (uu tien; tu dong chuyen sang Gemini khi Groq loi) ======
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=groq/compound-mini
app.groq.url=https://api.groq.com/openai/v1/chat/completions


