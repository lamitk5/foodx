spring.application.name=inventory-service
server.port=8082

# ---------------------------------------------------------------------------
# Database riêng của inventory-service (database-per-service)
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/foodx_inventory?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Mọi dòng log đều mang mã tương quan (X-Correlation-Id) để lần theo request xuyên service
logging.pattern.level=%5p [%X{correlationId:-no-cid}]

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# Giao tiếp nội bộ giữa các microservice (chỉ khai báo service thực sự gọi tới)
# ---------------------------------------------------------------------------
foodx.internal.token=${FOODX_INTERNAL_TOKEN:foodx-internal-dev-token}

# Quét ảnh hoá đơn / tủ lạnh -> nhờ ai-service nhận diện thực phẩm
foodx.services.ai-service=${FOODX_SERVICES_AI_SERVICE:http://localhost:8085}
