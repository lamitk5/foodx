spring.application.name=ai-service
server.port=8085

# ---------------------------------------------------------------------------
# Database riêng của ai-service (database-per-service)
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/foodx_ai?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Tomcat: đủ thread cho nhiều user; AI được bulkhead riêng nên không cần quá lớn
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20s

# Hikari pool
spring.datasource.hikari.maximum-pool-size=24
spring.datasource.hikari.minimum-idle=6
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Mọi dòng log đều mang mã tương quan (X-Correlation-Id) để lần theo request xuyên service
logging.pattern.level=%5p [%X{correlationId:-no-cid}]

# AI bulkhead + cache bối cảnh
app.ai.max-concurrent=12
app.ai.acquire-timeout-ms=3000
app.ai.context-cache-ttl-ms=45000
app.rate-limit-per-minute=120

# ---------------------------------------------------------------------------
# Giao tiếp nội bộ giữa các microservice (chỉ khai báo service thực sự gọi tới)
# ---------------------------------------------------------------------------
foodx.internal.token=${FOODX_INTERNAL_TOKEN:foodx-internal-dev-token}

# Bối cảnh chat: hồ sơ dinh dưỡng + thực phẩm trong tủ
foodx.services.user-service=${FOODX_SERVICES_USER_SERVICE:http://localhost:8081}
foodx.services.inventory-service=${FOODX_SERVICES_INVENTORY_SERVICE:http://localhost:8082}

# Gemini API (dự phòng)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-2.0-flash
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models

# Groq API (ưu tiên)
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=llama-3.1-8b-instant
app.groq.url=https://api.groq.com/openai/v1/chat/completions
