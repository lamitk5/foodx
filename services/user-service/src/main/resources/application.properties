spring.application.name=user-service
server.port=8081

# ---------------------------------------------------------------------------
# Database riêng của user-service (database-per-service)
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/foodx_user?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Mọi dòng log đều mang mã tương quan (X-Correlation-Id) để lần theo request xuyên service
logging.pattern.level=%5p [%X{correlationId:-no-cid}]

# ---------------------------------------------------------------------------
# Giao tiếp nội bộ giữa các microservice
# Cấu hình dùng chung (JWT, đường dẫn /internal) nằm ở foodx-common; ở đây chỉ
# khai báo những service mà user-service THỰC SỰ gọi tới. Khi deploy, đặt qua
# biến môi trường (FOODX_SERVICES_*, FOODX_INTERNAL_TOKEN) — không sửa file này.
# ---------------------------------------------------------------------------
foodx.internal.token=${FOODX_INTERNAL_TOKEN:foodx-internal-dev-token}

# Admin xoá tài khoản -> yêu cầu từng service tự dọn dữ liệu của họ
foodx.services.inventory-service=${FOODX_SERVICES_INVENTORY_SERVICE:http://localhost:8082}
foodx.services.recipe-service=${FOODX_SERVICES_RECIPE_SERVICE:http://localhost:8083}
foodx.services.plan-shopping-service=${FOODX_SERVICES_PLAN_SHOPPING_SERVICE:http://localhost:8084}
foodx.services.ai-service=${FOODX_SERVICES_AI_SERVICE:http://localhost:8085}
foodx.services.social-stats-service=${FOODX_SERVICES_SOCIAL_STATS_SERVICE:http://localhost:8086}
