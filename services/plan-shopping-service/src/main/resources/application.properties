spring.application.name=plan-shopping-service
server.port=8084

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/foodx?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# JWT
app.jwt.secret=dev-super-secret-key-please-change-this-key-32bytes!!
app.jwt.expiration-ms=86400000
app.jwt.issuer=foodx

# Downstream service URLs
app.ai-service.url=http://localhost:8085
app.inventory-service.url=http://localhost:8082
app.recipe-service.url=http://localhost:8083
