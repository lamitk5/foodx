spring.application.name=plan-shopping-service
server.port=8084

# ---------------------------------------------------------------------------
# Database riêng của plan-shopping-service (database-per-service)
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/foodx_plan?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Mọi dòng log đều mang mã tương quan (X-Correlation-Id) để lần theo request xuyên service
logging.pattern.level=%5p [%X{correlationId:-no-cid}]

# ---------------------------------------------------------------------------
# Giao tiếp nội bộ giữa các microservice (chỉ khai báo service thực sự gọi tới)
# ---------------------------------------------------------------------------
foodx.internal.token=${FOODX_INTERNAL_TOKEN:foodx-internal-dev-token}

# Hồ sơ dinh dưỡng -> mục tiêu kcal/ngày, chế độ ăn, dị ứng
foodx.services.user-service=${FOODX_SERVICES_USER_SERVICE:http://localhost:8081}
# Tủ lạnh (gợi ý món, nạp tủ khi mua xong) + danh mục nguyên liệu
foodx.services.inventory-service=${FOODX_SERVICES_INVENTORY_SERVICE:http://localhost:8082}
# Kho công thức để dựng thực đơn
foodx.services.recipe-service=${FOODX_SERVICES_RECIPE_SERVICE:http://localhost:8083}
# Gợi ý thực đơn bằng AI
foodx.services.ai-service=${FOODX_SERVICES_AI_SERVICE:http://localhost:8085}
