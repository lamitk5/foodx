spring.application.name=social-stats-service
server.port=8086

# ---------------------------------------------------------------------------
# Database riêng của social-stats-service (database-per-service)
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/foodx_social?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Mọi dòng log đều mang mã tương quan (X-Correlation-Id) để lần theo request xuyên service
logging.pattern.level=%5p [%X{correlationId:-no-cid}]

# ---------------------------------------------------------------------------
# Giao tiếp nội bộ giữa các microservice (chỉ khai báo service thực sự gọi tới)
# ---------------------------------------------------------------------------
foodx.internal.token=${FOODX_INTERNAL_TOKEN:foodx-internal-dev-token}

# Tên/avatar tác giả bài viết
foodx.services.user-service=${FOODX_SERVICES_USER_SERVICE:http://localhost:8081}
# Trừ nguyên liệu trong tủ sau khi "nấu xong"
foodx.services.inventory-service=${FOODX_SERVICES_INVENTORY_SERVICE:http://localhost:8082}
# Tên + calo công thức cho thống kê
foodx.services.recipe-service=${FOODX_SERVICES_RECIPE_SERVICE:http://localhost:8083}
