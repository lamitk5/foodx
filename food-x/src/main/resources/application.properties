spring.application.name=food-x

server.port=8080

spring.thymeleaf.cache=false
# ==============================
# MYSQL - FOOD X
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/foodx_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=foodx
spring.datasource.password=FoodX@123456

# ==============================
# JPA / HIBERNATE
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true         
# ==============================
# AVATAR UPLOAD
# ==============================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB